<!DOCTYPE html>
<html>
<head><title>Contact Us</title></head>
<body>
    <nav>
        <a href="index.html">Home</a> | <a href="about.html">About</a> | <a href="modules.html">Modules</a> | <a href="contact.html">Contact</a>
    </nav>
    <h1>Contact Us</h1>
    <form>
        <h3>Personal Information</h3>
        First Name: <input type="text" name="fname" required><br><br>
        Surname: <input type="text" name="surname" required><br><br>
        Email: <input type="email" name="email" required><br><br>
        Student No: <input type="text" name="studentno" required><br><br>

        <h3>Enquiry Type</h3>
        <select name="enquiry">
            <option>General enquiry</option>
            <option>Programme information</option>
            <option>Registration</option>
            <option>Technical support</option>
            <option>Other</option>
        </select><br><br>

        <h3>Message</h3>
        <textarea rows="5" cols="40" placeholder="Type your message here"></textarea><br><br>

        <h3>Preferred Contact Method</h3>
        <input type="radio" name="contact"> Email
        <input type="radio" name="contact"> Phone
        <input type="radio" name="contact"> SMS <br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>
    <footer><p>&copy; 2026 Group 21</p></footer>
</body>
</html>
